[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "file-agent"
version = "2.0.0"
description = "Agente de gestión de archivos, terminal, navegador y búsqueda en tiempo real con UI moderna y memoria persistente"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.0",
    "pydantic>=2.0",
    "pydantic-settings",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pypdf>=6.13.2",
    "python-docx",
    "openpyxl",
    "python-pptx",
    "playwright>=1.40.0",
    "mcp>=1.0.0,<2",
    "tavily-python",
    "customtkinter>=5.2",
    "sqlmodel>=0.0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["agent", "app"]

[project.scripts]
file-agent = "app.main:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
