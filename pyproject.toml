[project]
name = "file-agent"
version = "2.0.0"
description = "Agente de gestión de archivos y terminal con lenguaje natural"
requires-python = ">=3.11"
dependencies = [
    "ollama",
    "pydantic>=2.0",
    "pydantic-settings",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tinydb",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
