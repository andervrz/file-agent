# agent.yaml
agent:
  name: "File Agent"
  version: "2.0.0"
  description: "Agente de gestión de archivos, terminal, navegador y búsqueda en tiempo real"

llm:
  provider: "ollama"
  host: "https://ollama.com"
  model: "gpt-oss:20b-cloud"
  temperature: 0.1
  num_ctx: 4096
  num_predict: 4096

system_prompt: >-
  Eres File Agent. Gestión de archivos, terminal Linux, navegador web y búsqueda en tiempo real.
  Responde siempre en español. Sé conciso. Usa rutas absolutas. Home: {HOME}

  REGLAS CRÍTICAS:
  1. NUNCA afirmes haber completado una operación sin haber ejecutado el tool.
  2. Si el archivo ya existe y el usuario quiere sobreescribirlo, usa create_file con overwrite=true.
  3. Para leer PDFs como texto usa read_pdf. Para VERLOS visualmente usa browser.
  4. Para listar carpetas usa list_directory con la ruta absoluta exacta.
  5. Para crear archivos dentro de una carpeta usa la ruta completa: {HOME}/carpeta/archivo.txt
  6. Para eliminar ARCHIVOS usa delete_file. Para CARPETAS usa delete_directory.
  7. Para abrir archivos que el navegador soporta (PDF, imágenes, HTML, video) usa browser.
     Para Word, Excel, PowerPoint usa open_file.
  8. Para navegar o interactuar con páginas web usa browser.
  9. Para buscar información actualizada en internet usa web_search.
  10. Para consultar documentación de librerías: PRIMERO llama resolve-library-id para obtener el libraryId, LUEGO llama get-library-docs con ese ID.
      Son dos llamadas obligatorias en secuencia. No repitas resolve-library-id.
  11. No repitas el mismo tool con los mismos argumentos.
  12. Nunca describas contenido sin haberlo leído con un tool.
  13. Responde SOLO con la información final. NUNCA escribas "THOUGHT:" ni razonamiento interno.

tools:
  enabled:
    # ── Fase 1: File tools ────────────────────────────────────────────────────
    - create_file
    - read_file
    - list_directory
    - move_file
    - copy_file
    - delete_file
    - delete_directory
    - create_directory
    - search_files
    - run_command
    # ── Fase 2: PDF ───────────────────────────────────────────────────────────
    - read_pdf
    # ── Fase 2.5: Tools avanzados ─────────────────────────────────────────────
    - backup
    - git
    - create_word
    - create_excel
    - create_presentation
    - archive
    - create_from_template
    - diff_files
    - find_in_files
    # ── Fase 3: SO, navegador y búsqueda ─────────────────────────────────────
    - open_file
    - browser
    - web_search
    # Nota: tools MCP (resolve-library-id, get-library-docs, tavily_search...)
    # se cargan automáticamente desde mcp_servers — no van en esta lista.

# ── MCP Servers ───────────────────────────────────────────────────────────────
mcp_servers:
       
  # Context7 vía stdio (RECOMENDADO — evita el bug GET 405)
  - name: "context7"
    command: "npx"
    args: ["-y", "@upstash/context7-mcp"]
    api_key_env: "CONTEXT7_API_KEY"   # lee de tu .env
    transport: "stdio"
    enabled: true


  - name: "tavily"
    url: "https://mcp.tavily.com/mcp/"
    api_key_env: "TAVILY_API_KEY"
    api_key_param: "tavilyApiKey"
    api_key_header: ""
    transport: "streamable-http"
    enabled: false   # keys dev no soportan endpoint MCP — activar con plan paid

context:
  max_history_messages: 10
  max_iterations: 25

skills:
  path: "./skills"

memory:
  enabled: true
  path: "./memory"

traces:
  enabled: true
  path: "./traces"

security:
  levels:
    safe:      [cat, ls, grep, find, head, tail, wc, pwd, echo, date, which, file, stat, du, df, sort, uniq, cut]
    moderate:  [touch, mkdir, cp, mv, chmod, ln]
    dangerous: [rm, rmdir, dd, truncate]
    blocked:   [sudo, su, bash, sh, python, pip, apt, curl, wget, nc, eval, exec, source, "chmod +x"]
  require_confirmation: [dangerous]
  blocked_paths:
    - /etc
    - /sys
    - /usr
    - /bin
    - /sbin
    - /proc
    - /dev
  timeout_seconds:
    safe:      30
    moderate:  45
    dangerous: 60
